<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="main-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="Images/F1.png" alt="Grid Line Logo" class="logo-image">
        <span class="logo-text">GRID<span class="logo-accent">LINE</span></span>
      </a>

      <nav class="nav-menu" id="primaryNav">
        <ul>
          <li><a href="index.html">HOME</a></li>
          <li><a href="drivers.html">DRIVERS</a></li>
          <li><a href="schedule.html">SCHEDULE</a></li>
          <li><a href="contacts.html" class="active">CONTACTS</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-intro">
      <div class="intro-text">
      <p class="hero-eyebrow">Feedback</p>
      <h1>Write to the Grid Line Team</h1>
      <p class="hero-sub">Have a question or an idea? Send us a message below.</p>
      </div>
      <img src="Images/post.png" class="poster-icon">
    </section>

    <section class="form-section">
      <form id="contact-form" action="#" method="post">

        <div class="form-row">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="How to address you" required>
        </div>

        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-row">
          <label for="team">Favorite Team</label>
          <select id="team" name="team">
            <option value="mclaren">McLaren</option>
            <option value="ferrari">Ferrari</option>
            <option value="mercedes">Mercedes</option>
            <option value="redbull">Red Bull</option>
            <option value="astonmartin">Aston Martin</option>
            <option value="cadillac">Cadillac</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-row">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Tell more" required></textarea>
        </div>

        <button type="submit" class="btn-primary">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Created by Asset, Ramazan</p>
  </footer>
</body>
</html>
