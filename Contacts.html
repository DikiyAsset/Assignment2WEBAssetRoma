<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacts</title>
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="Style.css">
  <script src="vendor/bootstrap.bundle.min.js" defer></script>
</head>
<body>

  <header id="main-header">
    <nav class="navbar navbar-expand-lg navbar-dark p-0" aria-label="Main navigation">
      <div class="header-inner container-fluid">
        <a href="index.html" class="logo">
          <img src="Images/F1.png" alt="Grid Line Logo" class="logo-image">
          <span class="logo-text">GRID<span class="logo-accent">LINE</span></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#primaryNav" aria-controls="primaryNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="nav-menu collapse navbar-collapse flex-grow-0" id="primaryNav">
          <ul class="navbar-nav">
          <li class="nav-item"><a href="index.html" class="nav-link">HOME</a></li>
          <li class="nav-item"><a href="Drivers.html" class="nav-link">DRIVERS</a></li>
          <li class="nav-item"><a href="Schedule.html" class="nav-link">SCHEDULE</a></li>
          <li class="nav-item"><a href="Contacts.html" class="nav-link active" aria-current="page">CONTACTS</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main id="main-content">
    <section class="page-intro">
      <div class="intro-text">
      <p class="hero-eyebrow">Feedback</p>
      <h1>Write to the Grid Line Team</h1>
      <p class="hero-sub">Have a question or an idea? Send us a message below.</p>
      </div>
      <img src="Images/post.png" alt="Envelope illustration" class="poster-icon">
    </section>

    <section class="form-section">
      <form id="contact-form" action="#" method="post">

        <div class="form-row">
          <label class="form-label" for="name">Name</label>
          <input class="form-control" type="text" id="name" name="name" placeholder="How to address you" required>
        </div>

        <div class="form-row">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-row">
          <label class="form-label" for="team">Favorite Team</label>
          <select class="form-select" id="team" name="team">
            <option value="mclaren">McLaren</option>
            <option value="ferrari">Ferrari</option>
            <option value="mercedes">Mercedes</option>
            <option value="redbull">Red Bull</option>
            <option value="astonmartin">Aston Martin</option>
            <option value="cadillac">Cadillac</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-row">
          <label class="form-label" for="message">Message</label>
          <textarea class="form-control" id="message" name="message" rows="5" placeholder="Tell more" required></textarea>
        </div>

        <fieldset class="form-row">
          <legend class="mb-2">Topic</legend>
          <div class="d-flex flex-wrap gap-3">
            <div class="form-check"><input class="form-check-input" type="radio" id="topic-question" name="topic" value="question" checked><label class="form-check-label" for="topic-question">Question</label></div>
            <div class="form-check"><input class="form-check-input" type="radio" id="topic-idea" name="topic" value="idea"><label class="form-check-label" for="topic-idea">Idea</label></div>
          </div>
        </fieldset>
        <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="reply" name="reply"><label class="form-check-label" for="reply">Bla bla bla</label></div>
        <p class="form-note">messages are not sent.</p>
        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Created by Asset, Ramazan</p>
  </footer>
</body>
</html>
